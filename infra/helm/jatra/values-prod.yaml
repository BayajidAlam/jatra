# Production values for jatra
# This file overrides the default values.yaml for PRODUCTION environment

global:
  environment: production
  imagePullPolicy: Always

# Disable in-cluster databases (Use AWS RDS & ElastiCache instead)
postgresql:
  enabled: false

redis:
  enabled: false

rabbitmq:
  enabled: true # Keep RabbitMQ unless using Amazon MQ
  persistence:
    enabled: true
    size: 20Gi # Increased for production

# Ingress configuration for AWS ALB
ingress:
  enabled: true
  className: alb
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/certificate-arn: "arn:aws:acm:region:account:certificate/certificate-id" # user needs to fill this
    alb.ingress.kubernetes.io/ssl-redirect: "443"
  hosts:
    - host: api.jatra.com
      paths:
        - path: /
          pathType: Prefix
          service: api-gateway
  tls: [] # TLS handled by ALB via Certificate Manager (ACM)

# Observability Strategy (Thesis Section 3.5.4)
monitoring:
  enabled: false # Self-hosted Prometheus disabled
  
  # AWS X-Ray for Distributed Tracing
  xray:
    enabled: true
    image: amazon/aws-xray-daemon:latest
    cpu: 256m
    memory: 512Mi
    
  # AWS CloudWatch for Logs & Metrics
  cloudwatch:
    enabled: true
    image: amazon/cloudwatch-agent:latest
    retentionDays: 14
    logging:
      enabled: true
      logGroup: "/aws/eks/jatra-railway/application"
